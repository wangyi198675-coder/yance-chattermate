[package]
name = "yance-desktop"
version = "0.0.355"
description = "Yance Windows desktop shell with native private runtime bridge"
edition = "2021"

[[bin]]
name = "Yance"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
tauri = "=2.12.0"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-window-state = "=2.4.1"
velopack = "=1.2.161"
uuid = { version = "1", features = ["v4"] }
base64 = "=0.22.1"
