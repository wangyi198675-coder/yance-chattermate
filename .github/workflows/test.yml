name: Yance QA contracts and native E2E

on:
  push:
    branches: [main, integrate/post-c2-controlled-source-20261007, 'work/window373-*']
  pull_request:
    branches: [main, integrate/post-c2-controlled-source-20261007]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-preflight:
    name: Requirement catalog and Playwright discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract integrity (not full product PASS)
        working-directory: frontend
        run: node e2e/quality/verify-coverage.mjs --mode=preflight
      - name: Assert fault injection really blocks invalid coverage and stale SHA
        working-directory: frontend
        run: node e2e/quality/gate-selftest.mjs
      - name: Adversarial actual trace ZIP byte and status verification
        working-directory: frontend
        run: node e2e/quality/playwright-artifact-selftest.mjs
      - name: Guard P1 native test-source assertions against regressions (not E2E)
        working-directory: frontend
        run: node e2e/quality/native-provenance-selftest.mjs
      - name: Verify current-branch native runner/workflow source contract (not activation)
        working-directory: frontend
        run: node e2e/quality/ci-workflow-contract.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Playwright test discovery
        working-directory: frontend
        run: npx playwright test --project=chromium-native --list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ github.sha }}
          path: frontend/test-results/yance-quality/
          if-no-files-found: warn

  backend-test:
    name: Backend pytest (not provider acceptance)
    runs-on: ubuntu-24.04
    # Real PostgreSQL 16 + pgvector, isolated for this GitHub-hosted job only.
    # W381 clones one migrated w381_test_* database per integration test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_ci_only_not_production
          POSTGRES_DB: w381_test_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w381_test_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ephemeral_ci_only_not_production@127.0.0.1:5432/w381_test_template
      W381_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ephemeral_ci_only_not_production@127.0.0.1:5432/w381_test_template
      PGPASSWORD: ephemeral_ci_only_not_production
      ENVIRONMENT: development
      REDIS_ENABLED: 'false'
      S3_FILE_STORAGE: 'false'
      PYTHONPATH: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real PostgreSQL 16 and pgvector server, not SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql -h 127.0.0.1 -U postgres -d w381_test_template -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -h 127.0.0.1 -U postgres -d w381_test_template -v ON_ERROR_STOP=1 -Atc "SELECT current_setting('server_version_num'), extversion FROM pg_extension WHERE extname='vector';"
          test "$(psql -h 127.0.0.1 -U postgres -d w381_test_template -Atc "SELECT current_setting('server_version_num')::int >= 160000 AND current_setting('server_version_num')::int < 170000 AND EXISTS (SELECT 1 FROM pg_extension WHERE extname='vector')")" = t
      - name: Install existing dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx pytest-cov
      - name: Migrate real private PostgreSQL test template with Alembic
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['W381_TEST_POSTGRES_URL'])
          assert url.drivername.startswith('postgresql')
          assert url.host == '127.0.0.1'
          assert url.database == 'w381_test_template'
          with create_engine(url).connect() as conn:
              assert conn.execute(text("SELECT to_regclass('public.session_to_agents')")).scalar_one()
              assert conn.execute(text("SELECT to_regclass('public.user_notification_settings')")).scalar_one()
              assert conn.execute(text("SELECT count(*) FROM alembic_version")).scalar_one() == 1
              assert conn.execute(text("SELECT extversion FROM pg_extension WHERE extname='vector'")).scalar_one()
          print('REAL_PG16_PGVECTOR_ALEMBIC_TEMPLATE_VERIFIED')
          PY
      - name: Run pytest (preserve all real failures, including W387 Agent schema)
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=65

  frontend-test:
    name: Vitest typecheck build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run type-check
      - run: npm run build-only

  native-chromium:
    name: REQUIRED real isolated PG Chromium 920x620 (no mock PASS)
    # Ephemeral official hosted VM. No daily-desktop/self-hosted runner registration.
    # Pull requests get only repository read scope, with no provider or production secrets.
    runs-on: windows-2025
    needs: [contract-preflight]
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      YANCE_QA_NATIVE_URL: http://127.0.0.1:5173
      YANCE_QA_NATIVE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify this is a short-lived GitHub-hosted PR-safe Windows VM
        shell: pwsh
        run: |
          if ("${{ runner.environment }}" -ne "github-hosted") { throw "GITHUB_HOSTED_ONLY" }
          if ("${{ github.event_name }}" -eq "pull_request_target") { throw "PR_TARGET_FORBIDDEN" }
          if ("${{ github.event_name }}" -eq "pull_request" -and "${{ github.event.pull_request.head.repo.fork }}" -eq "true") {
            Write-Output "FORK_PR_WITH_READ_ONLY_TOKEN_NO_PRODUCTION_SECRETS"
          }
          Write-Output ("RUNNER_IMAGE="+$env:ImageOS+";SHA="+$env:GITHUB_SHA)
      - name: Install real private PostgreSQL, Alembic schema and native ORM fixture
        id: native_setup
        shell: pwsh
        run: ./frontend/e2e/quality/hosted-windows-native.ps1 -Phase prepare
      - name: Install real frontend and Chromium
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "NPM_CI_FAILED" }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "PLAYWRIGHT_CHROMIUM_INSTALL_FAILED" }
      - name: Real ChatterMate plus Chrome 920x620 and durable PostgreSQL restart in one Windows job
        id: native_real
        shell: pwsh
        run: |
          # The first real GH Windows jobs proved detached native processes can
          # disappear between Actions steps. Hold the same step open until
          # BOTH real Chromium execution AND real process restart conclude.
          ./frontend/e2e/quality/hosted-windows-native.ps1 -Phase start
          if (-not $?) { throw "REAL_NATIVE_BACKEND_OR_VUE_START_FAILED" }
          Push-Location frontend
          try {
            npx playwright test --project=chromium-native
            $nativeExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          ./frontend/e2e/quality/hosted-windows-native.ps1 -Phase restart
          if (-not $?) { throw "REAL_NATIVE_POSTGRES_RESTART_FAILED" }
          if ($nativeExit -ne 0) { throw "REAL_NATIVE_CHROMIUM_FAILED" }
      - name: Capture CI self-observation (never official W362 approval)
        if: always()
        working-directory: frontend
        run: node e2e/quality/capture-ci-provenance.mjs
      - name: Uncovered requirement ledger (separate from native execution)
        if: always()
        working-directory: frontend
        run: node e2e/quality/verify-coverage.mjs --mode=preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ github.sha }}
          path: |
            frontend/test-results/playwright-artifacts/
            frontend/test-results/playwright-results.json
            frontend/test-results/playwright-html/
            frontend/test-results/yance-quality/
          if-no-files-found: warn
